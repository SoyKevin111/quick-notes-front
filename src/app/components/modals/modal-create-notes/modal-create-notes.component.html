<div class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center">
  <div class="modal bg-white p-8 rounded-lg shadow-2xl w-[500px] max-w-full h-auto relative z-50 overflow-hidden">
    <h2 class="text-3xl font-semibold text-gray-900 mb-6 text-center">Hola desde el Modal</h2>
    <p class="text-lg text-gray-700 mb-6 text-center"><b>Message: </b>{{message}}</p>

    <div (click)="close()" class="cursor-pointer absolute top-4 right-4 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-full p-2 transition-all duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>

    <div class="flex justify-center mt-8">
      <button (click)="close()" class="bg-indigo-600 text-white py-3 px-8 rounded-lg shadow-lg hover:bg-indigo-700 transition-all duration-300">
        Cerrar
      </button>
    </div>
  </div>
</div>

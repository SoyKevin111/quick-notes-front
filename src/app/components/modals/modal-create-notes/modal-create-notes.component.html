<div class="fixed inset-0 bg-black bg-opacity-60 z-40 flex items-center justify-center">
  <div
    [ngClass]="animationState"
    class="w-[400px] bg-white ">
    <h1 class="py-[1rem] text-center font-bold text-[1.2rem]">CREATE NOTE</h1>

    <form [formGroup]="createNoteForm" (ngSubmit)="onSubmit()" class="px-[2rem] pb-[2rem] space-y-5">
      <div>
        <label for="title" class="block mb-2 text-sm font-medium text-gray-900">Title</label>
        <input formControlName="title" type="text" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Enter a title" required />
      </div>
    
      <div>
        <label for="type" class="block mb-2 text-sm font-medium text-gray-900">Sticker</label>
        <select formControlName="emojiRef" id="type" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" required>
          <option value="" disabled selected>Select a type</option>
          <option value="nota">Study</option>
          <option value="deporte">Deport</option>
          <option value="comida">Food</option>
          <option value="insecto">Insect</option>
        </select>
      </div>
    
      <div>
        <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
        <textarea formControlName="description" id="description" rows="3" class="max-h-[100px] bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Write your description here..." required></textarea>
      </div>
      
      <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Submit</button>
    </form>
    
  </div>
</div>
